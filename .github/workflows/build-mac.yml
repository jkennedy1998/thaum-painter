name: build-mac

# Builds an Apple Silicon lane for build-all-environments. This is a private
# build artifact, not a public GitHub Release.
on:
  workflow_dispatch:
    inputs:
      painter_ref:
        description: Exact pushed thaum-painter commit to build
        required: true
        type: string
      renderer_ref:
        description: Exact pushed thaum-renderer commit to build
        required: true
        type: string

jobs:
  build-mac:
    runs-on: macos-latest # Apple Silicon; Intel Macs use Rosetta 2
    steps:
      - name: checkout thaum-painter
        uses: actions/checkout@v4
        with:
          path: thaum-painter
          ref: ${{ inputs.painter_ref }}

      - name: checkout thaum-renderer
        uses: actions/checkout@v4
        with:
          repository: jkennedy1998/thaum-renderer
          token: ${{ secrets.REPO_PAT }}
          path: thaum-renderer
          ref: ${{ inputs.renderer_ref }}

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: thaum-painter

      - name: build and package Mac lane
        working-directory: thaum-painter
        run: |
          set -euo pipefail
          ./orchestration/build-commands/build-all-environments mac-local
          cd orchestration/builds/mac
          zip -qry thaum-painter-mac.zip "thaum painter"
          mv thaum-painter-mac.zip "$GITHUB_WORKSPACE/"

      - name: upload Mac lane
        uses: actions/upload-artifact@v4
        with:
          name: thaum-painter-mac
          path: thaum-painter-mac.zip
