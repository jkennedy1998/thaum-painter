name: release-thaum-painter

# Called only by orchestration/build-commands/release-thaum-painter after it
# has pushed the version tag. Every job receives immutable painter and renderer
# commit IDs so the three public archives are one coherent release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag, for example v0.1.2
        required: true
        type: string
      painter_ref:
        description: Exact pushed thaum-painter commit to package
        required: true
        type: string
      renderer_ref:
        description: Exact pushed thaum-renderer commit to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: thaum-painter
          ref: ${{ inputs.painter_ref }}
      - uses: actions/checkout@v4
        with:
          repository: jkennedy1998/thaum-renderer
          token: ${{ secrets.REPO_PAT }}
          path: thaum-renderer
          ref: ${{ inputs.renderer_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: thaum-painter
      - name: build and package Linux lane
        working-directory: thaum-painter
        run: |
          set -euo pipefail
          ./orchestration/build-commands/build-all-environments linux
          tar -C orchestration/builds/linux -czf "$GITHUB_WORKSPACE/thaum-painter-linux.tar.gz" "thaum painter"
      - uses: actions/upload-artifact@v4
        with:
          name: thaum-painter-linux
          path: thaum-painter-linux.tar.gz

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: thaum-painter
          ref: ${{ inputs.painter_ref }}
      - uses: actions/checkout@v4
        with:
          repository: jkennedy1998/thaum-renderer
          token: ${{ secrets.REPO_PAT }}
          path: thaum-renderer
          ref: ${{ inputs.renderer_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: thaum-painter
      - name: install Windows cross toolchain
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: build and package Windows lane
        working-directory: thaum-painter
        run: |
          set -euo pipefail
          rustup target add x86_64-pc-windows-gnu
          ./orchestration/build-commands/build-all-environments windows
          cd orchestration/builds/windows
          zip -qry "$GITHUB_WORKSPACE/thaum-painter-windows.zip" "thaum painter"
      - uses: actions/upload-artifact@v4
        with:
          name: thaum-painter-windows
          path: thaum-painter-windows.zip

  build-mac:
    runs-on: macos-latest # Apple Silicon; Intel Macs use Rosetta 2
    steps:
      - uses: actions/checkout@v4
        with:
          path: thaum-painter
          ref: ${{ inputs.painter_ref }}
      - uses: actions/checkout@v4
        with:
          repository: jkennedy1998/thaum-renderer
          token: ${{ secrets.REPO_PAT }}
          path: thaum-renderer
          ref: ${{ inputs.renderer_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: thaum-painter
      - name: build and package Mac lane
        working-directory: thaum-painter
        run: |
          set -euo pipefail
          ./orchestration/build-commands/build-all-environments mac-local
          cd orchestration/builds/mac
          zip -qry "$GITHUB_WORKSPACE/thaum-painter-mac.zip" "thaum painter"
      - uses: actions/upload-artifact@v4
        with:
          name: thaum-painter-mac
          path: thaum-painter-mac.zip

  publish-release:
    needs: [build-linux, build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.version }}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Thaum Painter ${{ inputs.version }}" \
            --generate-notes
